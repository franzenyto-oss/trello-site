services:
  - type: web
    name: mini-trello
    runtime: node
    buildCommand: npm ci && npm run prisma:generate:postgres && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
